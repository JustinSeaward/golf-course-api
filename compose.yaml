services:
  server:
    build:
      context: .
    ports:
      - 8080:8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: golfcourse
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:

